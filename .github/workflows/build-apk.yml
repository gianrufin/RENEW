name: Build & Host Android APK and GitHub Pages

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Android APK & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Setup Node.js & Build Web App
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      # 2. Setup Java, Gradle & Build Native Android APK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Ensure Gradle Wrapper & Config
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar || \
            curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.6/gradle-wrapper-8.6.jar || true
          fi
          chmod +x android/gradlew
          
          # Ensure gradle.properties exists with AndroidX enabled
          if [ ! -f android/gradle.properties ]; then
            echo "android.useAndroidX=true" >> android/gradle.properties
            echo "android.nonTransitiveRClass=true" >> android/gradle.properties
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dandroid.useAndroidX=true

      - name: Prepare APK Artifacts & Bundle into Web Dist
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/RENEW-Household-Maintenance.apk
            # Also place APK inside dist for direct GitHub Pages web download
            cp build-output/RENEW-Household-Maintenance.apk dist/RENEW-Household-Maintenance.apk
            echo "APK successfully built and bundled into web build: $(ls -lh build-output/RENEW-Household-Maintenance.apk)"
          else
            echo "Error: app-debug.apk not found!"
            find android/app/build -name "*.apk" || true
            exit 1
          fi

      # 3. Upload APK to GitHub Artifacts
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RENEW-Household-Maintenance-APK
          path: build-output/RENEW-Household-Maintenance.apk
          retention-days: 90

      # 4. Deploy Web App & Hosted APK to GitHub Pages
      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4

      # 5. Publish Release with APK Asset to GitHub Releases
      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/RENEW-Household-Maintenance.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('RENEW App {0}', github.ref_name) || 'RENEW Native Android App (Latest Build)' }}
          make_latest: true
          body: |
            ## 📱 RENEW. — Household Maintenance & Alert Scheduler
            
            ### ⬇️ Download Direct APK
            - **[Download RENEW-Household-Maintenance.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/RENEW-Household-Maintenance.apk)**
            
            ### 🌐 Live GitHub Pages App & Direct Hosted Download:
            - **Web App**: `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/`
            - **Hosted APK**: `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/RENEW-Household-Maintenance.apk`
            
            ### 📦 Build Details:
            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **Target SDK**: Android 34 (Android 14)
            - **Min SDK**: Android 26 (Android 8.0+)
            - **Architecture**: Universal APK (ARM64, ARMv7, x86_64)
            
            ### 🛠️ Installation Instructions:
            1. Download `RENEW-Household-Maintenance.apk` onto your Android phone.
            2. Tap the downloaded file in your browser downloads or file manager.
            3. If prompted, allow *"Install unknown apps"* for your browser/file manager.
            4. Tap **Install** and open **RENEW.**!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
