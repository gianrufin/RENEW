name: Build & Host Android APK and GitHub Pages

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Android APK & Landing Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Setup Node.js & Build Web App Landing Page
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      # 2. Setup Java 17 & Android Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Configure Android Properties
        run: |
          mkdir -p android
          cat << 'EOF' > android/gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace --no-daemon -Dandroid.useAndroidX=true -Dandroid.nonTransitiveRClass=true

      - name: Bundle APK into Distribution
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found compiled APK at: $APK_FILE"
            cp "$APK_FILE" build-output/RENEW-Household-Maintenance.apk
            # Place APK inside dist folder so GitHub Pages hosts it directly
            cp "$APK_FILE" dist/RENEW-Household-Maintenance.apk
            echo "Successfully copied APK to build-output and dist/"
            ls -lh dist/RENEW-Household-Maintenance.apk
          else
            echo "Error: Could not find compiled APK file!"
            find android/app/build -name "*.apk" || true
            exit 1
          fi

      # 3. Upload APK to GitHub Artifacts (Always available under GitHub Actions run)
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RENEW-Household-Maintenance-APK
          path: build-output/RENEW-Household-Maintenance.apk
          retention-days: 90

      # 4. Deploy Landing Page & Hosted APK to GitHub Pages
      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 5. Publish to GitHub Releases
      - name: Publish APK to GitHub Releases
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: build-output/RENEW-Household-Maintenance.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('RENEW App {0}', github.ref_name) || 'RENEW Native Android App (Latest Build)' }}
          make_latest: true
          body: |
            ## 📱 RENEW. — Household Maintenance & Alert Scheduler
            
            ### ⬇️ Download Direct APK
            - **[Download RENEW-Household-Maintenance.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/RENEW-Household-Maintenance.apk)**
            
            ### 🌐 Live Landing Page & Hosted Direct Download:
            - **Web App / Landing Page**: `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/`
            - **Direct APK URL**: `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/RENEW-Household-Maintenance.apk`
            
            ### 📦 Build Specs:
            - Target SDK: Android 34 (Android 14)
            - Min SDK: Android 26 (Android 8.0+)
            - Architecture: Universal APK (ARM64, ARMv7, x86_64)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
