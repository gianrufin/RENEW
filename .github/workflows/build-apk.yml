name: Build & Host Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/RENEW-Household-Maintenance.apk
          echo "APK build complete: $(ls -lh build-output/)"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RENEW-Household-Maintenance-APK
          path: build-output/RENEW-Household-Maintenance.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/RENEW-Household-Maintenance.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('RENEW App {0}', github.ref_name) || 'RENEW Native Android App (Latest Build)' }}
          body: |
            ## 📱 RENEW. — Household Maintenance & Alert Scheduler
            
            ### ⬇️ Download Direct APK
            - **[Download RENEW-Household-Maintenance.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/RENEW-Household-Maintenance.apk)**
            
            ### 📦 Build Details:
            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **Target SDK**: Android 34 (Android 14)
            - **Min SDK**: Android 26 (Android 8.0+)
            - **Architecture**: Universal APK (ARM64, ARMv7, x86_64)
            
            ### 🛠️ Installation Instructions:
            1. Download `RENEW-Household-Maintenance.apk` onto your Android phone.
            2. Tap the downloaded file in your browser downloads or file manager.
            3. If prompted, allow *"Install unknown apps"* for your browser/file manager.
            4. Tap **Install** and open **RENEW.**!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
